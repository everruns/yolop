name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-yolop:
    name: Publish yolop to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Verify version matches tag
        env:
          # `release.tag_name` is set for the `release: published` event.
          # `ref_name` is set when this workflow is dispatched against a tag
          # (the normal path — release.yml does `gh workflow run --ref vX.Y.Z`).
          # Whichever is set is the authoritative tag; both falling back to
          # empty means a manual dispatch against `main`, where there's no
          # tag to verify against.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG_VERSION="${RELEASE_TAG#v}"
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_VERSION="${REF_NAME#v}"
          else
            echo "Manual dispatch against a non-tag ref — skipping tag verification"
            exit 0
          fi
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_if_missing() {
            local crate="$1"
            local version
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')

            if curl --fail --silent --user-agent "yolop-release-workflow (https://github.com/everruns/yolop)" \
              "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published"
              return
            fi

            cargo publish --locked -p "$crate"
            for _ in {1..30}; do
              if curl --fail --silent --user-agent "yolop-release-workflow (https://github.com/everruns/yolop)" \
              "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                return
              fi
              sleep 10
            done
            echo "$crate $version did not become available on crates.io" >&2
            return 1
          }

          # yolop depends on both library crates by version, so crates.io
          # requires them live before yolop. Order: leaf deps first, binary last.
          publish_if_missing yolop-yep
          publish_if_missing tuika
          publish_if_missing yolop

  verify-publish:
    name: Verify published version
    runs-on: ubuntu-latest
    needs: publish-yolop
    steps:
      - uses: actions/checkout@v7

      - name: Wait for crates.io index propagation
        run: sleep 60

      - name: Verify crates.io serves the new version
        run: |
          EXPECTED=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Expected version: $EXPECTED"
          python3 scripts/verify_crates_publish.py --expected "$EXPECTED" yolop
