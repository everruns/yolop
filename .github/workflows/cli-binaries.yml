# Prebuilt CLI binaries — dispatched by release.yml after the GitHub Release
# is created. GITHUB_TOKEN-created releases don't fire `release: published`
# (anti-recursion), so the release workflow dispatches this one explicitly.
name: Publish CLI Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Prebuilt extension servers. A crates.io package carries source and yolop's
  # install path is toolchain-free by design, so an extension published without
  # these installs cleanly and can never spawn; install fetches the archive its
  # manifest points at. Tagged per extension (`<crate>-v<version>`) rather than
  # riding the yolop tag, so the URL is derivable from the package alone and an
  # extension can release on its own cadence.
  extensions:
    name: Build ${{ matrix.crate }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        crate: [yolop-extension-logfire]
        # `target` must be a matrix dimension, not an `include`-only key: an
        # include entry that names no existing dimension is merged into *every*
        # combination, so three of them collapse onto the single `crate` job and
        # the last one wins. v0.17.0 shipped Linux-only servers that way. Listing
        # the targets here makes the cross product real; the includes below only
        # attach a runner to each one.
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p ${{ matrix.crate }} --locked

      - name: Package binary
        id: package
        env:
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c "$CRATE" '.packages[] | select(.name == $c) | .version')
          ARCHIVE="$CRATE-$VERSION-$TARGET.tar.gz"
          cd "target/$TARGET/release"
          tar czf "$GITHUB_WORKSPACE/$ARCHIVE" "$CRATE"
          cd "$GITHUB_WORKSPACE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "ext_tag=$CRATE-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload to the extension's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          EXT_TAG: ${{ steps.package.outputs.ext_tag }}
          CRATE: ${{ matrix.crate }}
        run: |
          # The release is per extension version and shared by all targets, so
          # the first runner to finish creates it and the rest upload into it.
          if ! gh release view "$EXT_TAG" >/dev/null 2>&1; then
            gh release create "$EXT_TAG" \
              --title "$EXT_TAG" \
              --notes "Prebuilt \`$CRATE\` servers, fetched by \`yolop extensions install\`." \
              || gh release view "$EXT_TAG" >/dev/null
          fi
          gh release upload "$EXT_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --clobber

  # The portable build: default features, no `local-inference`. This is the
  # artifact `yolop-<target>.tar.gz` names and the one the Homebrew formula
  # points at, because it is the only one that runs anywhere the target does.
  # An engine build is ~28 MB against a few MB here, and the accelerated ones
  # below additionally need a vendor runtime present on the machine, which is
  # not a thing to hand someone who typed `brew install`.
  build:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: yolop-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: yolop-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: yolop-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cli-${{ matrix.target }}"

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p yolop --locked

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/$TARGET/release"
          tar czf "$GITHUB_WORKSPACE/$ARCHIVE" yolop
          cd "$GITHUB_WORKSPACE"
          # macOS ships shasum but not sha256sum by default; Linux is the
          # opposite. Pick the one that exists so the workflow doesn't break
          # if a runner image drops the other.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --clobber

  # The accelerated builds: `local-inference` plus the GPU backend the target
  # can actually use. Kept out of `build` on purpose. They are a separate
  # download, not the default, because each carries a runtime requirement the
  # portable build does not: a `cuda` binary needs an NVIDIA driver on the
  # machine, and neither is worth ~28 MB to someone who will never run
  # `--provider local`. Kept out of `update-homebrew`'s `needs` for the same
  # reason: `cuda` is the least proven build in the release, and it must not be
  # able to hold back the formula.
  build-accelerated:
    name: Build CLI (${{ matrix.target }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            backend: metal
            archive: yolop-aarch64-apple-darwin-metal.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            backend: metal
            archive: yolop-x86_64-apple-darwin-metal.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            backend: cuda
            archive: yolop-x86_64-unknown-linux-gnu-cuda.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The engine plus the CUDA toolkit does not fit next to the runner's
      # preinstalled SDKs. These are the four largest and nothing here uses
      # them.
      - name: Free disk space
        if: matrix.backend == 'cuda'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost
          df -h /

      # `nvcc` is what `cudarc`'s build script looks for; without it the build
      # panics rather than degrading. Ubuntu's own package is used instead of a
      # third-party action so the release depends on one less external repo.
      - name: Install the CUDA toolkit
        if: matrix.backend == 'cuda'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
          nvcc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cli-${{ matrix.target }}-${{ matrix.backend }}"

      - name: Build release binary
        env:
          # The kernels are compiled for one compute capability, and the usual
          # way that is chosen is by asking `nvidia-smi` what the build machine
          # has. No runner has a GPU, so it has to be named. 8.0 is the floor
          # candle compiles at, not a preference: its kernels call `__hmax_nan`
          # and `__hmin_nan`, which nvcc only defines for `__CUDA_ARCH__ >= 800`,
          # so 7.5 fails outright in `compatibility.cuh`. Anything newer than
          # Ampere reaches the binary through PTX.
          CUDA_COMPUTE_CAP: 80
        run: |
          cargo build --release --target ${{ matrix.target }} -p yolop --locked \
            --features ${{ matrix.backend }}

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/$TARGET/release"
          tar czf "$GITHUB_WORKSPACE/$ARCHIVE" yolop
          cd "$GITHUB_WORKSPACE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --clobber

  update-homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download SHA256 checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "yolop-${target}.tar.gz.sha256"
          done

      - name: Generate Homebrew formula
        env:
          TAG: ${{ inputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          for f in yolop-aarch64-apple-darwin.tar.gz.sha256 \
                   yolop-x86_64-apple-darwin.tar.gz.sha256 \
                   yolop-x86_64-unknown-linux-gnu.tar.gz.sha256; do
            if [[ ! -s "$f" ]]; then
              echo "::error::checksum file '$f' is missing or empty"
              exit 1
            fi
          done

          SHA_ARM64=$(awk '{print $1}' yolop-aarch64-apple-darwin.tar.gz.sha256)
          SHA_X86_64_MACOS=$(awk '{print $1}' yolop-x86_64-apple-darwin.tar.gz.sha256)
          SHA_LINUX=$(awk '{print $1}' yolop-x86_64-unknown-linux-gnu.tar.gz.sha256)

          for var in SHA_ARM64 SHA_X86_64_MACOS SHA_LINUX; do
            if [[ -z "${!var}" ]]; then
              echo "::error::extracted $var is empty"
              exit 1
            fi
          done

          BASE_URL="${SERVER_URL}/${REPO}/releases/download/${TAG}"
          HOMEPAGE="${SERVER_URL}/${REPO}"

          cat > yolop.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Yolop < Formula
            desc "Minimal terminal coding agent built on everruns-host"
            homepage "${HOMEPAGE}"
            # No explicit `version` — Homebrew scans it from the download URL
            # (the release tag in the path). Setting it again trips
            # `brew audit` with "version is redundant with version scanned
            # from URL".
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/yolop-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "${BASE_URL}/yolop-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_MACOS}"
              end
            end

            on_linux do
              depends_on arch: :x86_64
              url "${BASE_URL}/yolop-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "yolop"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/yolop --version")
            end
          end
          FORMULA

          # Strip the leading indentation that heredoc preserved.
          sed -i 's/^          //' yolop.rb

          echo "Generated formula:"
          cat yolop.rb

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Push formula to homebrew-tap
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"

          # Fetch the homebrew-tap PAT from Doppler. This token is a
          # fine-grained PAT scoped to `everruns/homebrew-tap` only
          # (Contents: read+write, Metadata: read), so a leak cannot
          # touch this repo.
          # `doppler secrets get --plain` appends a trailing newline; strip
          # it so the PAT compares cleanly against `git credential` checks
          # and add-mask sees the actual secret without the line break.
          GH_PAT=$(doppler secrets get HOMEBREW_TAP_GITHUB_TOKEN --plain | tr -d '\n\r')
          export GH_PAT
          echo "::add-mask::$GH_PAT"

          # Use askpass to keep the token out of clone/push URLs and logs.
          ASKPASS_SCRIPT=$(mktemp)
          cat > "$ASKPASS_SCRIPT" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *Password*) echo "$GH_PAT" ;;
          esac
          EOF
          chmod 700 "$ASKPASS_SCRIPT"
          export GIT_ASKPASS="$ASKPASS_SCRIPT"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$ASKPASS_SCRIPT"; unset GH_PAT' EXIT

          git clone "https://github.com/everruns/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp yolop.rb tap/Formula/yolop.rb

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/yolop.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "yolop ${VERSION}"
          git push origin main
