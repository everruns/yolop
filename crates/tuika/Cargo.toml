[package]
name = "tuika"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Everruns <support@everruns.com>"]
license = "MIT"
description = "A composable terminal UI toolkit — flexbox layout, overlays, focus, and safe ratatui interoperability."
homepage = "https://github.com/everruns/yolop"
repository = "https://github.com/everruns/yolop"
readme = "README.md"
keywords = ["tui", "terminal", "ratatui", "widgets", "layout"]
categories = ["command-line-interface"]
# The `docs/` demo/theme/styling GIFs total ~8 MiB and are consumed only by the
# GitHub-rendered README and `docs/*.md` (served from the repo, not the crate).
# rustdoc/docs.rs references none of them — the crate-level docs live in a
# hand-written `//!` header in `lib.rs` — so bundling them just bloats the
# published `.crate`. Keep `hero.gif` and `demos/image.svg`: those are the only
# two the crates.io README (`README.md`) embeds by relative path. See
# `tests/packaging.rs` for the guard that keeps this list honest.
exclude = ["docs/demos/*.gif", "docs/styling/*.gif", "docs/themes/*.gif"]

# Build docs with every feature so the optional `async` runner is documented,
# and set the `docsrs` cfg that turns on per-item feature badges (see lib.rs).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# No `#[bench]` fns in the lib, and the default libtest bench harness rejects
# Criterion's CLI flags — disable it so `cargo bench` runs only the Criterion
# targets below.
[lib]
bench = false

[features]
# The async runner (`AsyncRunner`). Off by default so sync-only hosts don't pull
# in a Tokio runtime. Enabling it adds Tokio (timer + `select!` macro), a
# `StreamExt` for polling the event stream, and crossterm's async `EventStream`.
async = ["dep:tokio", "dep:tokio-stream", "crossterm/event-stream"]

[dependencies]
# tuika uses only ratatui's cell buffer, style/text/layout primitives, the
# `Widget`/`StatefulWidget` traits, and the `Terminal`/backend loop — all of
# which live in `ratatui-core`. It renders none of ratatui's own widgets, so it
# depends on the sub-crates directly instead of the `ratatui` umbrella. This
# drops `ratatui-widgets` (Block/Paragraph/Table/Calendar/…) and `ratatui-macros`
# — and with them the `time`/`lru`/`line-clipping` transitive weight — from
# tuika's build. Downstream users keep every ratatui widget: they bring their own
# `ratatui` and render it through `Surface::render_ratatui`/`RatatuiView`, whose
# seam is a raw `&mut Buffer` from this same `ratatui-core` (Cargo unifies the
# version). `underline-color` matches the umbrella default so cell rendering is
# byte-identical; `std` is required for the terminal I/O loop.
ratatui-core = { version = "0.1", features = ["std", "underline-color"] }
# `CrosstermBackend` (+ `ClearType`/`WindowSize` impls) — the only piece tuika
# needs that is not in `ratatui-core`. Default features pin the crossterm 0.29
# backend, matching the direct `crossterm` dep below so Cargo dedups it.
ratatui-crossterm = "0.1"
crossterm = "0.29"
# Async runner only (feature = "async"). `time` for the tick interval, `macros`
# for `tokio::select!`; the host application brings its own runtime, so no `rt`.
tokio = { version = "1", features = ["time", "macros"], optional = true }
# `StreamExt::{next, filter_map}` for driving the crossterm `EventStream`.
tokio-stream = { version = "0.1", optional = true }
textwrap = "0.16"
unicode-segmentation = "1"
unicode-width = "0.2"
# CommonMark parsing for the streaming `Markdown` component. `default-features
# = false` drops the bundled HTML renderer and SIMD scanner we don't use, so
# this stays a small, pure-Rust addition to tuika's dependency set.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
proptest = "1"
# The `ratatui` umbrella is a dev-dependency only: benches build `Vec<Line>`
# corpora and paint into a `Buffer` directly, and the doc examples demonstrate
# wrapping real ratatui *widgets* through `RatatuiView`/`Surface::render_ratatui`.
# Its `ratatui-core` matches the version the library depends on, so the `Buffer`
# type is shared across the interop seam.
ratatui = "0.30.2"
# Benchmark harness. default-features off drops the plotters/rayon HTML-report
# stack (heavy, and an MSRV liability) while keeping `cargo bench` working;
# Criterion still writes machine-readable `estimates.json` for archiving.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# Instruction-count benchmark harness (deterministic, machine-independent) for
# the committed baseline / CI regression gate. Needs Valgrind + a version-matched
# `iai-callgrind-runner` installed (`cargo install iai-callgrind-runner`).
iai-callgrind = "0.16.1"
# The `async` runner's tests drive `AsyncRunner` on a Tokio runtime with a fake
# event stream; `test-util` gives paused-clock control so ticks are deterministic
# instead of wall-clock-timed. Reachable only when `--features async` is on.
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
tokio-stream = "0.1"

[[bench]]
name = "markdown"
harness = false

[[bench]]
name = "markdown_iai"
harness = false

[[bench]]
name = "scroll"
harness = false

[[bench]]
name = "scroll_iai"
harness = false

[[example]]
name = "async_dashboard"
required-features = ["async"]
