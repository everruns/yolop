[workspace]
members = ["crates/tuika", "crates/yolop-yep", "crates/yolop-extension-computer-use"]

[package]
name = "yolop"
version = "0.10.0"
edition = "2024"
authors = ["Everruns <support@everruns.com>"]
license = "MIT"
description = "Yolop — a terminal coding agent built on everruns-runtime"
homepage = "https://github.com/everruns/yolop"
repository = "https://github.com/everruns/yolop"
readme = "README.md"
keywords = ["cli", "agent", "coding", "terminal", "llm"]
categories = ["command-line-utilities", "development-tools"]
# Demo media is for the GitHub README only; keep it out of the crate package.
exclude = ["/docs"]

[[bin]]
name = "yolop"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "1.0.1"
anyhow = "1.0"
ast-grep-core = "0.44"
ast-grep-language = { version = "0.44", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c-sharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
eventsource-stream = "0.2"
# Toolchain-free crates.io extension install: fetch + unpack a `.crate`
# (gzip'd tar) natively, no cargo/rustc. Pure-Rust backends (miniz_oxide),
# so yolop stays a self-contained binary.
flate2 = "1"
tar = "0.4"
# `.worktreeinclude` matching for copying ignored local files into worktrees.
ignore = "0.4"
include_dir = "0.7"
rand = "0.10"
ratatui = "0.30.2"
# Already in the tree via the everruns driver crates; used directly only for
# the OpenAI-compatible `GET <base>/models` discovery fallback.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The extension protocol wire types + server SDK live in their own crate so
# extension authors can depend on them from crates.io; the host shares the
# same source of truth (see specs/extensions.md).
yolop-yep = { version = "0.2.0", path = "crates/yolop-yep" }
sha2 = "0.11"
toml = "1"
textwrap = "0.16"
tuika = { version = "0.2.0", path = "crates/tuika" }
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

everruns-anthropic = "0.17.16"
everruns-core = "0.17.16"
everruns-openai = "0.17.16"
# OpenRouter's first-class driver was split out of everruns-openai into its own
# crate in 0.13.0; register it alongside openai to keep DriverId::OpenRouter.
everruns-openrouter = "0.17.16"
everruns-local = "0.17.16"
everruns-mcp = "0.17.16"
# `mcp-stdio` lets yolop talk to local-process MCP servers; the hosted
# everruns server/worker never enable it (specs/mcp.md, upstream runtime-mcp.md D2).
everruns-runtime = { version = "0.17.16", features = ["mcp-stdio"] }
everruns-integrations-duckduckgo = "0.17.16"
everruns-integrations-parallel = "0.17.16"
everruns-integrations-daytona = "0.17.16"
arboard = { version = "3", features = ["wayland-data-control"] }
futures = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
urlencoding = "2"
comfy-table = { version = "7.2.2", default-features = false }

# Linux's default local sandbox uses Landlock for filesystem rights and
# seccomp-BPF for network denial. Both are pure-Rust wrappers over kernel APIs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
inventory = "0.3"
portable-pty = "0.9.0"
proptest = "1"
tempfile = "3"
tiny_http = "0.12"
vt100 = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
