[workspace]
members = [
    "crates/yolop-yep",
    "extensions/yolop-extension-logfire",
]

[package]
name = "yolop"
version = "0.16.0"
edition = "2024"
authors = ["Everruns <support@everruns.com>"]
license = "MIT"
description = "Yolop — a terminal coding agent built on everruns-runtime"
homepage = "https://github.com/everruns/yolop"
repository = "https://github.com/everruns/yolop"
readme = "README.md"
keywords = ["cli", "agent", "coding", "terminal", "llm"]
categories = ["command-line-utilities", "development-tools"]
# Demo media is for the GitHub README only; keep it out of the crate package.
exclude = ["/docs"]

[[bin]]
name = "yolop"
path = "src/main.rs"

[features]
default = []
# Experimental in-process inference (`--provider local`). Off by default: the
# engine pulls ~258 extra crates and dominates build time, which would punish
# `cargo install yolop` and the contributor `cargo check` loop. The shipped
# artifacts turn it on instead — see .github/workflows/cli-binaries.yml, which
# builds the release binaries (and therefore the Homebrew formula) with it.
local-inference = ["dep:mistralrs", "dep:hf-hub"]

# GPU acceleration for `local-inference`. The engine runs on CPU unless one of
# these is on, and an 8B model on CPU is slow enough to read as "local models
# are useless" when the real finding is "this was never accelerated" — so the
# switch has to exist and be discoverable, not just be described in prose.
#
# Both are separate from `local-inference` because they need a vendor toolchain
# the plain feature does not: `metal` only builds on macOS, and `cuda` needs the
# CUDA toolkit installed. Enabling either implies `local-inference`.
#
# Their existence is why the checks say `--features local-inference` and not
# `--all-features`: the latter enables both, and on a Linux CI runner both fail
# to build — `cuda` needs `nvcc`, `metal` pulls `objc2`, which is Apple-only.
# Cargo has no way to exclude a feature from `--all-features`, so the feature
# list has to be spelled out.
metal = ["local-inference", "mistralrs/metal"]
cuda = ["local-inference", "mistralrs/cuda"]

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
ast-grep-core = "0.45"
ast-grep-language = { version = "0.45", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c-sharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
eventsource-stream = "0.2"
# Toolchain-free crates.io extension install: fetch + unpack a `.crate`
# (gzip'd tar) natively, no cargo/rustc. Pure-Rust backends (miniz_oxide),
# so yolop stays a self-contained binary.
flate2 = "1"
tar = "0.4"
# `.worktreeinclude` matching for copying ignored local files into worktrees.
ignore = "0.4"
include_dir = "0.7"
jsonschema = { version = "0.49.2", default-features = false }
# In-process inference engine behind the `local-inference` feature. Pure Rust
# on CPU (candle underneath), so an enabled build still needs no C/C++
# toolchain; `metal`/`cuda` do and stay opt-in on top.
mistralrs = { version = "0.8.1", optional = true }
# Weight downloads. Already in the tree via mistralrs; depended on directly so
# yolop owns the fetch (and its progress reporting) instead of the engine doing
# it invisibly inside the first inference call.
hf-hub = { version = "0.4.3", default-features = false, features = [
    "tokio",
    "rustls-tls",
], optional = true }
rand = "0.10"
ratatui = "0.30.2"
# Already present through everruns-local. Yolop uses the same SQLite handle for
# its capability-owned local session coordination tables.
rusqlite = "0.39"
# Already in the tree via the everruns driver crates; used directly only for
# the OpenAI-compatible `GET <base>/models` discovery fallback.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The extension protocol wire types + server SDK live in their own crate so
# extension authors can depend on them from crates.io; the host shares the
# same source of truth (see knowledge/specs/extensions.md).
yolop-yep = { version = "0.3.0", path = "crates/yolop-yep" }
sha2 = "0.11"
toml = "1"
textwrap = "0.16"
# The TUI toolkit behind both renderers. It lives in its own repository
# (everruns/tuika) and is consumed from crates.io like any other dependency;
# yolop gets no special treatment there.
tuika = "0.10.0"
# Optional structured-markdown renderers stay outside tuika core. Mermaid
# fences become terminal diagrams; safe block HTML becomes styled text.
tuika-mermaid = "0.3.1"
tuika-html = "0.1.3"
# Tree-sitter Highlighter impl for tuika's CodeBlock/Markdown; owns the grammar
# deps so tuika core stays dependency-light. Published from the tuika repo.
tuika-codeformatters = "0.4.3"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 0.17.24 added a value-first `everruns` facade crate that re-exports core and
# runtime behind one dependency. Yolop deliberately does not use it: the facade
# covers core + runtime (plus an `openai` feature), while yolop also needs the
# anthropic, openrouter, local, mcp, and integration crates, and reaches into
# core APIs the facade does not surface (capabilities, hooks, session tasks, MCP
# transports, the driver registry). Adopting it today would collapse two of nine
# dependencies and route the rest through escape hatches. Revisit when the
# facade promotes provider registration, MCP, and capability wiring.
everruns-anthropic = "0.18.0"
everruns-core = "0.18.0"
# The identity/platform family (PlatformStore and friends) moved out of
# everruns-core into its own crate in 0.17.24; yolop implements PlatformStore
# to route background-task wakes (src/runtime/background_wake.rs).
everruns-platform = "0.18.2"
everruns-openai = "0.18.0"
everruns-meta = "0.18.0"
# OpenRouter's first-class driver was split out of everruns-openai into its own
# crate in 0.13.0; register it alongside openai to keep DriverId::OpenRouter.
everruns-openrouter = "0.18.0"
# Filesystem persistence comes from the `everruns` facade's `local` feature, not
# the standalone `everruns-local` crate: same SQLite, git-workspace, and durable
# log backend, re-exported under `everruns::local`. `everruns-local` is published
# only against host ^0.18.0, so depending on it pinned yolop off the 0.19 line.
# Only the `local` feature is wanted; the facade's provider and capability
# re-exports would duplicate the direct dependencies below.
everruns = { version = "0.18.2", default-features = false, features = ["local"] }
everruns-mcp = { version = "0.19.0", features = ["stdio"] }
# `mcp-stdio` lets yolop talk to local-process MCP servers; the hosted
# everruns server/worker never enable it (knowledge/specs/mcp.md, upstream runtime-mcp.md D2).
#
# everruns-host replaces everruns-runtime, which upstream deleted in #3101 as a
# 0.18 breaking change. Every host symbol yolop used moved here unchanged except
# EventBus, which the canonical event log replaces.
everruns-host = { version = "0.20.1", features = ["mcp-stdio"] }
# The direct egress implementation moved out of everruns-core into its own
# crate; yolop uses it for MCP OAuth discovery.
# #3182 completed the library boundary cleanup: driver/model/provider types
# and the built-in capabilities left everruns-core for their own crates.
everruns-provider = "0.18.0"
everruns-builtins = "0.18.1"
everruns-capability = "0.18.0"
everruns-http = "0.18.0"
# Yolop ships `--provider llmsim` as a user-facing offline mode, not just a test
# fixture, so the simulator is a production dependency. 0.18 split it into the
# production-safe `everruns-llmsim`; `everruns-test-support` documents itself as
# test-only and must not be used from production code. The `host` feature carries
# the runtime-builder extension trait.
everruns-llmsim = { version = "0.18.2", features = ["host"] }
# Filesystem and web-fetch capability implementations moved out of
# everruns-core into their own integration crates (#3119).
everruns-integrations-filesystem = "0.18.0"
everruns-integrations-web-fetch = "0.18.0"
everruns-integrations-duckduckgo = "0.18.0"
everruns-integrations-parallel = "0.18.0"
everruns-integrations-daytona = "0.18.0"
arboard = { version = "3", features = ["wayland-data-control"] }
futures = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
urlencoding = "2"

# Linux's default local sandbox uses Landlock for filesystem rights and
# seccomp-BPF for network denial. Both are pure-Rust wrappers over kernel APIs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
inventory = "0.3"
portable-pty = "0.9.0"
proptest = "1"
tempfile = "3"
tiny_http = "0.12"
vt100 = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Full DWARF dominated `target/`: a clean `cargo build --tests` left 6.3 GB
# behind (3.7 GB now), two of yolop's own test binaries accounting for 839 MB
# of it. Line tables are what a backtrace actually reads, and backtraces plus
# `RUST_LOG` are how this codebase is debugged; a debugger that needs variable
# inspection gets it from `cargo build --profile dev-debuginfo`. Build scripts
# and proc macros keep nothing, since nobody steps into those at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
debug = false

# Opt back in to full DWARF for a debugger session, without making every other
# build pay for it.
[profile.dev-debuginfo]
inherits = "dev"
debug = true
