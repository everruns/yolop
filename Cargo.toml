[workspace]
members = [
    "crates/yolop-yep",
    "extensions/yolop-extension-logfire",
]

[package]
name = "yolop"
version = "0.15.2"
edition = "2024"
authors = ["Everruns <support@everruns.com>"]
license = "MIT"
description = "Yolop — a terminal coding agent built on everruns-runtime"
homepage = "https://github.com/everruns/yolop"
repository = "https://github.com/everruns/yolop"
readme = "README.md"
keywords = ["cli", "agent", "coding", "terminal", "llm"]
categories = ["command-line-utilities", "development-tools"]
# Demo media is for the GitHub README only; keep it out of the crate package.
exclude = ["/docs"]

[[bin]]
name = "yolop"
path = "src/main.rs"

[features]
default = []
# Experimental in-process inference (`--provider local`). Off by default: the
# engine pulls ~258 extra crates and dominates build time, which would punish
# `cargo install yolop` and the contributor `cargo check` loop. The shipped
# artifacts turn it on instead — see .github/workflows/cli-binaries.yml, which
# builds the release binaries (and therefore the Homebrew formula) with it.
local-inference = ["dep:mistralrs"]

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
ast-grep-core = "0.45"
ast-grep-language = { version = "0.45", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c-sharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
eventsource-stream = "0.2"
# Toolchain-free crates.io extension install: fetch + unpack a `.crate`
# (gzip'd tar) natively, no cargo/rustc. Pure-Rust backends (miniz_oxide),
# so yolop stays a self-contained binary.
flate2 = "1"
tar = "0.4"
# `.worktreeinclude` matching for copying ignored local files into worktrees.
ignore = "0.4"
include_dir = "0.7"
jsonschema = { version = "0.49.2", default-features = false }
# In-process inference engine behind the `local-inference` feature. Pure Rust
# on CPU (candle underneath), so an enabled build still needs no C/C++
# toolchain; `metal`/`cuda` do and stay opt-in on top.
mistralrs = { version = "0.8.1", optional = true }
rand = "0.10"
ratatui = "0.30.2"
# Already in the tree via the everruns driver crates; used directly only for
# the OpenAI-compatible `GET <base>/models` discovery fallback.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The extension protocol wire types + server SDK live in their own crate so
# extension authors can depend on them from crates.io; the host shares the
# same source of truth (see knowledge/specs/extensions.md).
yolop-yep = { version = "0.3.0", path = "crates/yolop-yep" }
sha2 = "0.11"
toml = "1"
textwrap = "0.16"
# The TUI toolkit behind both renderers. It lives in its own repository
# (everruns/tuika) and is consumed from crates.io like any other dependency;
# yolop gets no special treatment there.
tuika = "0.9.0"
# Optional structured-markdown renderers stay outside tuika core. Mermaid
# fences become terminal diagrams; safe block HTML becomes styled text.
tuika-mermaid = "0.3.0"
tuika-html = "0.1.2"
# Tree-sitter Highlighter impl for tuika's CodeBlock/Markdown; owns the grammar
# deps so tuika core stays dependency-light. Published from the tuika repo.
tuika-codeformatters = "0.4.2"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 0.17.24 added a value-first `everruns` facade crate that re-exports core and
# runtime behind one dependency. Yolop deliberately does not use it: the facade
# covers core + runtime (plus an `openai` feature), while yolop also needs the
# anthropic, openrouter, local, mcp, and integration crates, and reaches into
# core APIs the facade does not surface (capabilities, hooks, session tasks, MCP
# transports, the driver registry). Adopting it today would collapse two of nine
# dependencies and route the rest through escape hatches. Revisit when the
# facade promotes provider registration, MCP, and capability wiring.
everruns-anthropic = "0.17.25"
everruns-core = "0.17.25"
# The identity/platform family (PlatformStore and friends) moved out of
# everruns-core into its own crate in 0.17.24; yolop implements PlatformStore
# to route background-task wakes (src/runtime/background_wake.rs).
everruns-platform = "0.17.25"
everruns-openai = "0.17.25"
everruns-meta = "0.17.25"
# OpenRouter's first-class driver was split out of everruns-openai into its own
# crate in 0.13.0; register it alongside openai to keep DriverId::OpenRouter.
everruns-openrouter = "0.17.25"
everruns-local = "0.17.25"
everruns-mcp = { version = "0.17.25", features = ["stdio"] }
# `mcp-stdio` lets yolop talk to local-process MCP servers; the hosted
# everruns server/worker never enable it (knowledge/specs/mcp.md, upstream runtime-mcp.md D2).
everruns-runtime = { version = "0.17.25", features = ["mcp-stdio"] }
everruns-integrations-duckduckgo = "0.17.25"
everruns-integrations-parallel = "0.17.25"
everruns-integrations-daytona = "0.17.25"
arboard = { version = "3", features = ["wayland-data-control"] }
futures = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
urlencoding = "2"

# Linux's default local sandbox uses Landlock for filesystem rights and
# seccomp-BPF for network denial. Both are pure-Rust wrappers over kernel APIs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
inventory = "0.3"
portable-pty = "0.9.0"
proptest = "1"
tempfile = "3"
tiny_http = "0.12"
vt100 = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
