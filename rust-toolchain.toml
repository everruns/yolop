# everruns-llmsim 0.48.0 depends on llmsim 0.6, which uses
# `AtomicU64::try_update` (stable since 1.95), so the everruns graph no longer
# builds on its declared 1.94.0 MSRV. Matches the toolchain everruns itself
# builds with. Keep in sync with what the everruns-* dependency graph needs.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
